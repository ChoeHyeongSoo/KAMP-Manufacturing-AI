<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>파인블랭킹 유압 계통과 센서</title>
<style>
:root{--b:#D3D1C7;--text:#2C2C2A;--muted:#5F5E5A}
body{margin:0;padding:16px 20px;background:#fff;color:var(--text);font-family:"Malgun Gothic",sans-serif;max-width:680px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
p.sub{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.t,.th{font-family:"Malgun Gothic",sans-serif;font-size:14px;fill:#2C2C2A}.th{font-weight:600}
.ts{font-family:"Malgun Gothic",sans-serif;font-size:12px;fill:#5F5E5A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.c-gray>.th,.c-gray>.ts{fill:#444441}
.c-amber>rect{fill:#FAC775;stroke:#854F0B;stroke-width:.5}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.c-coral>.th{fill:#712B13}
.c-blue>rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.5}.c-blue>.th{fill:#0C447C}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple>.th{fill:#3C3489}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal>.ts{fill:#085041}
.fl{stroke-dasharray:6 6;fill:none;stroke-width:3;transition:stroke .3s,opacity .3s}
.mv{transition:transform .7s ease}
.fb{transform-box:fill-box;transform-origin:center}
.vib{stroke:#888780;stroke-width:1.5;fill:none}
.bad .vib{stroke:#E24B4A;stroke-width:2}
.bubble{opacity:0;fill:#fff;stroke:#185FA5;stroke-width:1}
.burr{opacity:0;transition:opacity .4s}
.bad .burr{opacity:1}
.btn{font-family:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:.5px solid #B4B2A9;background:#fff;color:var(--text);cursor:pointer}
.btn.on{background:#E6F1FB;color:#0C447C;border-color:#378ADD}
.btn.onbad{background:#FCEBEB;color:#A32D2D;border-color:#E24B4A}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 8px}
.kpi{background:#F6F5F1;border-radius:8px;padding:8px 10px}.kpi div:first-child{font-size:12px;color:var(--muted)}.kpi div:last-child{font-size:13px;font-weight:600}
@keyframes fl{to{stroke-dashoffset:-12}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:translateX(-.6px)}to{transform:translateX(.6px)}}
@keyframes rock{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes shake{0%{transform:translate(-1.5px,1px)}50%{transform:translate(1.5px,-1px)}100%{transform:translate(-1px,-1.5px)}}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
@keyframes jit{from{transform:translateX(calc(var(--a) * -1px))}to{transform:translateX(calc(var(--a) * 1px))}}
@media (prefers-reduced-motion:no-preference){
.anim .fl.on{animation:fl .5s linear infinite}.anim .rot{animation:spin .6s linear infinite}.anim .vib{animation:jit .12s ease-in-out infinite alternate}
.anim #motor{animation:sway .15s ease-in-out infinite alternate}
.anim.bad #motor{animation:rock .22s ease-in-out infinite alternate}
.anim.bad #pump,.anim.bad.shear #punchIn{animation:shake .1s linear infinite}
.anim.bad .bubble{animation:bub 1.2s linear infinite}
.anim.bad .fl.on{animation-duration:.35s}}
.still .mv{transition:none}
.still.bad #motor{transform:rotate(4deg)}
.still.bad .bubble{opacity:1}
</style>
</head>
<body>
<h1 id="h">파인블랭킹 프레스 유압 계통과 센서 배치(개념도)</h1>
<p class="sub" id="sub">버튼으로 공정 단계와 펌프 상태(정상/이상)를 바꿔 볼 수 있습니다. 센서는 가이드북 기준 유압펌프 상/하단·전력선에 있으나, 진동 센서의 정확한 부착 부위(모터/펌프)는 확정되지 않아 그림의 위치는 개념 배치입니다. 이상 모드의 기포·버는 원인 가설에 따른 예시이고, 압력은 센서가 없어 추정한 값입니다. 아래 신호는 개념 시뮬레이션이며 실측값이 아닙니다.</p>
<div id="root" class="anim" style="--a:1">
<svg width="100%" viewBox="0 0 680 400" role="img"><title>유압 계통과 센서 배치(개념도)</title>
<g class="c-gray"><rect x="40" y="36" width="90" height="34" rx="4"/><text class="th" x="85" y="58" text-anchor="middle">전원</text></g>
<line x1="85" y1="70" x2="85" y2="170" stroke="#888780" stroke-width="2"/>
<g class="c-amber"><rect x="70" y="108" width="30" height="22" rx="4"/></g>
<text class="ts" x="108" y="124">AI2 전류 센서</text>
<text class="ts" x="146" y="152">AI0 상부 진동</text>
<text class="ts" x="40" y="298">AI1 하부 진동</text>
<g id="motor" class="fb">
<g class="c-gray"><rect x="40" y="170" width="90" height="80" rx="4"/><text class="th" x="85" y="190" text-anchor="middle">모터</text></g>
<g class="rot fb"><circle cx="85" cy="222" r="16" fill="none" stroke="#5F5E5A" stroke-width="1.5"/><line x1="85" y1="208" x2="85" y2="236" stroke="#5F5E5A" stroke-width="2"/></g>
<g class="c-amber"><rect x="108" y="160" width="14" height="10" rx="2"/><rect x="108" y="250" width="14" height="10" rx="2"/></g>
<g class="vib"><path d="M126 152 q4 -6 8 0"/></g>
<g class="vib"><path d="M126 268 q4 6 8 0"/></g>
</g>
<line x1="130" y1="215" x2="155" y2="215" stroke="#5F5E5A" stroke-width="4"/>
<g id="pump" class="fb"><g class="c-coral"><rect x="155" y="190" width="80" height="50" rx="4"/><text class="th" x="195" y="220" text-anchor="middle">유압 펌프</text></g></g>
<g class="c-blue"><rect x="40" y="330" width="200" height="46" rx="4"/><text class="th" x="140" y="358" text-anchor="middle">오일 탱크</text></g>
<path class="fl on" d="M215 330 L215 240" stroke="#378ADD"/>
<circle class="bubble" cx="215" cy="322" r="3.5"/>
<circle class="bubble" cx="215" cy="322" r="2.5" style="animation-delay:.4s"/>
<circle class="bubble" cx="215" cy="322" r="3" style="animation-delay:.8s"/>
<path class="fl on" d="M235 215 L290 215" stroke="#D85A30"/>
<circle cx="330" cy="140" r="22" fill="#F6F5F1" stroke="#888780" stroke-width="1"/>
<line x1="330" y1="162" x2="330" y2="185" stroke="#888780" stroke-width="2"/>
<line id="needle" x1="330" y1="140" x2="330" y2="122" stroke="#E24B4A" stroke-width="2"/>
<circle cx="330" cy="140" r="2.5" fill="#5F5E5A"/>
<text class="ts" x="330" y="108" text-anchor="middle">압력계</text>
<g class="c-purple"><rect x="290" y="185" width="80" height="60" rx="4"/><text class="th" x="330" y="220" text-anchor="middle">제어 밸브</text></g>
<path id="lA" class="fl" d="M370 198 L390 198 L390 70 L460 70"/>
<path id="lB" class="fl" d="M370 215 L415 215 L415 163 L450 163"/>
<path id="lC" class="fl" d="M370 232 L390 232 L390 275 L460 275"/>
<path id="lR" class="fl" d="M330 245 L330 353 L240 353"/>
<rect x="432" y="30" width="200" height="285" rx="4" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4" stroke-width="0.8"/>
<text class="ts" x="532" y="334" text-anchor="middle">파인블랭킹 프레스</text>
<g class="c-gray"><rect x="460" y="50" width="140" height="40" rx="4"/><text class="ts" x="530" y="74" text-anchor="middle">메인 펀치 실린더</text></g>
<g id="punch" class="mv"><g id="punchIn" class="fb"><rect x="515" y="90" width="30" height="72" fill="#888780"/></g></g>
<g class="c-teal"><rect x="450" y="150" width="58" height="26" rx="3"/><text class="ts" x="479" y="167" text-anchor="middle">가압링</text><rect x="552" y="150" width="58" height="26" rx="3"/><text class="ts" x="581" y="167" text-anchor="middle">가압링</text></g>
<rect x="444" y="178" width="172" height="8" fill="#B4B2A9"/>
<g class="c-gray"><rect x="450" y="188" width="58" height="26" rx="3"/><text class="ts" x="479" y="205" text-anchor="middle">다이</text><rect x="552" y="188" width="58" height="26" rx="3"/><text class="ts" x="581" y="205" text-anchor="middle">다이</text></g>
<g id="counter" class="mv"><rect x="515" y="187" width="30" height="68" fill="#888780"/></g>
<g id="part" class="mv"><rect x="515" y="178" width="30" height="8" fill="#D85A30"/>
<polygon class="burr" points="515,178 505,183 509,186 515,186" fill="#A32D2D"/><polygon class="burr" points="545,178 555,183 551,186 545,186" fill="#A32D2D"/><polygon class="burr" points="518,186 521,193 524,186 527,191 530,186" fill="#A32D2D"/></g>
<g class="c-gray"><rect x="460" y="255" width="140" height="40" rx="4"/><text class="ts" x="530" y="279" text-anchor="middle">카운터 실린더</text></g>
</svg>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0" id="phases"></div>
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px">
<button class="btn" id="auto">자동 재생 끄기</button>
<button class="btn" id="mN">정상 펌프</button>
<button class="btn" id="mB">이상 펌프</button>
<span id="msg" style="font-size:13px;color:var(--muted);margin-left:6px"></span>
</div>
<div class="kpis">
<div class="kpi"><div>구동부 진동 (모터-펌프)</div><div id="k1"></div></div>
<div class="kpi"><div>흡입 기름 (가정)</div><div id="k2"></div></div>
<div class="kpi"><div>압력 (센서 없음, 추정)</div><div id="k3"></div></div>
<div class="kpi"><div>제품 전단면 (가정)</div><div id="k4"></div></div>
</div>
<svg width="100%" viewBox="0 0 680 170" role="img"><title>센서 신호 개념 시뮬레이션</title>
<text class="ts" x="0" y="14">센서 신호 (10Hz, 개념 시뮬레이션, 실측값 아님)</text>
<text class="ts" x="0" y="48">AI0 상부</text><text class="ts" x="0" y="98">AI1 하부</text><text class="ts" x="0" y="148">AI2 전류</text>
<line x1="80" y1="44" x2="680" y2="44" stroke="#D3D1C7" stroke-width="0.5"/><line x1="80" y1="94" x2="680" y2="94" stroke="#D3D1C7" stroke-width="0.5"/><line x1="80" y1="144" x2="680" y2="144" stroke="#D3D1C7" stroke-width="0.5"/>
<polyline id="s0" fill="none" stroke="#7F77DD" stroke-width="1.5"/><polyline id="s1" fill="none" stroke="#1D9E75" stroke-width="1.5"/><polyline id="s2" fill="none" stroke="#D85A30" stroke-width="1.5"/>
</svg>
</div>
<script>
const P=[
{n:'① 클램핑',m:'가압링이 소재를 눌러 고정',on:['lB'],pu:0,co:0,pa:0,load:.6},
{n:'② 전단',m:'메인 펀치 하강, 카운터가 버팀 (최대 부하)',on:['lA','lB','lC'],pu:14,co:14,pa:14,load:1},
{n:'③ 복귀·배출',m:'펀치 복귀, 제품 배출, 기름 복귀',on:['lC','lR'],pu:0,co:0,pa:0,load:.5},
{n:'④ 대기',m:'모터만 회전, 부하 없음',on:[],pu:0,co:0,pa:0,load:.3}];
const Q=new URLSearchParams(location.search),still=Q.has('phase');
let ph=0,bad=false,auto=!still,t=0;const B=[[],[],[]];
let seed=7;const rnd=still?()=>{seed=(seed*16807)%2147483647;return seed/2147483647}:Math.random;
const $=id=>document.getElementById(id),root=$('root'),box=$('phases');
P.forEach((p,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=p.n;b.onclick=()=>{auto=false;$('auto').textContent='자동 재생 켜기';set(i)};box.appendChild(b)});
const RED='#A32D2D',GREEN='#3B6D11';
function kpi(){
$('k1').textContent=bad?'시소처럼 흔들림 (상·하 반대)':'위아래 같이 미세하게';
$('k2').textContent=bad?'기포 발생 (캐비테이션)':'기포 없음';
$('k4').textContent=bad?(ph===1?'파단면·버 발생 위험':'다음 전단 때 위험'):'매끈한 전단면';
[$('k1'),$('k2'),$('k4')].forEach(e=>e.style.color=bad?RED:GREEN);}
function set(i){ph=i;const p=P[i];[...box.children].forEach((b,k)=>b.classList.toggle('on',k===i));
['lA','lB','lC','lR'].forEach(id=>{const e=$(id),on=p.on.includes(id);e.classList.toggle('on',on);e.setAttribute('stroke',on?(id==='lR'?'#378ADD':'#D85A30'):'#B4B2A9');e.style.opacity=on?1:.5});
$('punch').style.transform=`translateY(${p.pu}px)`;$('counter').style.transform=`translateY(${p.co}px)`;$('part').style.transform=`translateY(${p.pa}px)`;
root.classList.toggle('shear',i===1);$('msg').textContent=p.m;kpi();}
function mode(b){bad=b;root.style.setProperty('--a',b?4:1);root.classList.toggle('bad',b);$('mN').classList.toggle('on',!b);$('mB').classList.toggle('onbad',b);kpi();}
$('mN').onclick=()=>mode(false);$('mB').onclick=()=>mode(true);
$('auto').onclick=e=>{auto=!auto;e.target.textContent=auto?'자동 재생 끄기':'자동 재생 켜기'};
const g=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function tick(){t+=.1;const L=P[ph].load;
let a0=.06*g()*(.5+L),a1=.13*L*Math.sin(2*Math.PI*1.8*t)+.03*g(),cur=270*L*Math.sin(2*Math.PI*.6*t)+8*g(),pr=100*L+2*g();
if(bad){a0=.15*g()+(rnd()<.1?(rnd()<.5?-1:1)*(0.8+rnd()*.7):0);a1=.25*Math.sin(2*Math.PI*1.05*t)+.12*g();cur=270*L*(1+.3*g())*Math.sin(2*Math.PI*.6*t+.8*g())+120*Math.sin(.4*t)+60*g();pr=100*L*(1+.25*g())-(rnd()<.12?35:0);}
pr=Math.max(0,Math.min(130,pr));
$('needle').setAttribute('transform',`rotate(${-110+pr*1.7} 330 140)`);
$('k3').textContent=bad?`요동 ${pr.toFixed(0)}%`:`안정 ${pr.toFixed(0)}%`;$('k3').style.color=bad?RED:GREEN;
[[a0,1.6],[a1,.8],[cur,500]].forEach(([v,s],k)=>{B[k].push(Math.max(-1,Math.min(1,v/s)));if(B[k].length>120)B[k].shift();
$('s'+k).setAttribute('points',B[k].map((y,i)=>`${80+i*5},${44+50*k-y*20}`).join(' '))});}
if(still){
  root.classList.remove('anim');root.classList.add('still');$('h').style.display='none';$('sub').style.display='none';
  mode(Q.get('bad')==='1');set(+Q.get('phase'));for(let i=0;i<120;i++)tick();
  document.querySelectorAll('.bubble').forEach((b,i)=>b.setAttribute('cy',322-25*i));
}else{
  mode(Q.get('bad')==='1');set(0);setInterval(tick,100);setInterval(()=>{if(auto)set((ph+1)%4)},2200);
}
</script>
</body>
</html>
